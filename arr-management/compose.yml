services:
  # --- INDEXER MANAGEMENT ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - TZ=America/New_York
      - PUID=1000
      - PGID=1000
    ports:
      - 9696:9696
    volumes:
      - /dockerfiles/arr-management/prowlarr:/config
      - /NAS/data:/data
    networks:
      - media_net   # To talk to Arrs and Gluetun
      - proxy_net   # To access via NPM
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 160M
    restart: unless-stopped

  # --- REQUEST MANAGEMENT (Overseerr/Jellyseerr) ---
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    ports:
      - 5055:5055
    volumes:
      - /dockerfiles/arr-management/overseerr:/app/config
      - /NAS/data:/data
    networks:
      - media_net   # To send requests to Sonarr/Radarr
      - proxy_net   # To access the request portal via NPM
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 200M
    restart: unless-stopped
networks:
  media_net:
    external: true
  proxy_net:
    external: true
