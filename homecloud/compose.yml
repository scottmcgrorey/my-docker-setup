services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    volumes:
      - /NAS/drive/photos:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - 2283:2283
    depends_on:
      - immich-redis
      - immich-postgres
    restart: always
    networks:
      - media_net
      - proxy_net

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    volumes:
      - /dockerfiles/homecloud/immich/model-cache:/cache
    env_file:
      - .env
    restart: always
    networks:
      - media_net

  immich-redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    restart: always
    networks:
      - media_net

  immich-postgres:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
    volumes:
      - /NAS/drive/immich_db:/var/lib/postgresql/data
    restart: always
    networks:
      - media_net

networks:
  media_net:
    external: true
  proxy_net:
    external: true
